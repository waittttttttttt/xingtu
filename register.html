<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星途平台 - 账号注册</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Inter","Microsoft Yahei",sans-serif;}
        body{background-color: #f7f3ea;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .reg-wrap{width:480px;background:#fff;border-radius:24px;padding:60px 45px;box-shadow:0 8px 28px rgba(17,24,39,0.08);border:1px solid #f3f4f6;}
        .logo-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:35px;}
        .logo-icon{width:42px;height:42px;border-radius:12px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;}
        .logo-text{font-size:24px;font-weight:700;color:#111827;letter-spacing:1px;}
        .sub-title{text-align:center;color:#6b7280;font-size:15px;margin-bottom:45px;}
        .input-item{margin-bottom:24px;position:relative;}
        .input-item i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:16px;}
        .input-item input{width:100%;height:56px;padding:0 20px 0 50px;border:1px #e5e7eb solid;border-radius:16px;font-size:15px;background:#f9fafb;outline:none;transition:all 0.3s ease;}
        .input-item input:focus{border-color:#111827;background:#fff;box-shadow:0 0 0 3px rgba(17,24,39,0.05);}
        .reg-btn{width:100%;height:56px;background:#111827;color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s ease;}
        .reg-btn:hover{background:#1f2937;transform:translateY(-2px);}
        .switch-page{text-align:center;margin-top:25px;font-size:14px;color:#6b7280;}
        .switch-page a{color:#111827;text-decoration:none;font-weight:600;margin-left:5px;}
    </style>
</head>
<body>
    <div class="reg-wrap">
        <div class="logo-top">
            <div class="logo-icon">星</div>
            <div class="logo-text">星途学业科研平台</div>
        </div>
        <p class="sub-title">免费注册账号，开启智能学业规划</p>

        <div class="input-item">
            <i class="fas fa-user-tag"></i>
            <input type="text" id="regUser" placeholder="请设置登录账号">
        </div>
        <div class="input-item">
            <i class="fas fa-lock"></i>
            <input type="password" id="regPwd" placeholder="请设置登录密码">
        </div>
        <div class="input-item">
            <i class="fas fa-lock-open"></i>
            <input type="password" id="rePwd" placeholder="请再次确认密码">
        </div>

        <button class="reg-btn" onclick="register()">立即注册</button>
        <div class="switch-page">
            已有平台账号？<a href="login.html">返回登录</a>
        </div>
    </div>

<script>
function register(){
    let user = document.getElementById('regUser').value.trim();
    let pwd = document.getElementById('regPwd').value.trim();
    let repwd = document.getElementById('rePwd').value.trim();

    if(!user || !pwd || !repwd){
        alert('请填写完整注册信息');
        return;
    }
    if(pwd !== repwd){
        alert('两次输入密码不一致');
        return;
    }

    // 覆盖式保存：永远只有一个账号
    localStorage.setItem('regUser', user);
    localStorage.setItem('regPwd', pwd);

    alert('注册成功！即将跳转到登录页');
    window.location.href = "login.html";
}
</script>
</body>
</html>
