let tid = new URLSearchParams(location.search).get('tid');
let team = teamData[tid];
let nowMsg = [];
if(team){
    document.getElementById('teamTitle').innerText = team.title;
    document.getElementById('teamInfo').innerHTML = team.info;
    document.getElementById('teamIntro').innerHTML = team.intro;
    document.getElementById('teamRequire').innerHTML = team.require;
    document.getElementById('teamTime').innerHTML = team.time;
    document.getElementById('teamRes').innerHTML = team.res;
    document.getElementById('teamContact').innerText = team.contact;
    nowMsg = msgList[tid] || [];
    renderMsg();

// 渲染留言
function renderMsg(){
    let html = "";
    nowMsg.forEach(item=>{
        html += `
        <div class="msg-item">
            <div class="msg-user">${item.user}</div>
            <div class="msg-time">${item.time}</div>
            <div class="block-text">${item.text}</div>
        </div>
        `
    })
    document.getElementById('msgBox').innerHTML = html;
}

// 新增留言
function addTeamMsg(){
    let val = document.getElementById('teamMsg').value.trim();
    if(!val){
        alert("请填写你的咨询意向！");
        return;
    }
    let newM = {
        user:"在校参赛学生",
        time:new Date().toLocaleString(),
        text:val
    };
    nowMsg.unshift(newM);
    renderMsg();
    document.getElementById('teamMsg').value = "";
    alert("留言提交成功，等待负责人回复~");
}
