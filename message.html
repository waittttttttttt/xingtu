<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心 - 星途平台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.3.0/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {font-family: 'Inter', system-ui, sans-serif;background-color: #f7f3ea;color: #111827;display: flex;min-height: 100vh;}
        .sidebar {width: 250px;background-color: #111827;color: white;min-height: 100vh;padding: 24px 20px;display: flex;flex-direction: column;justify-content: space-between;flex-shrink: 0;}
        .sidebar-logo {display: flex;align-items: center;gap: 10px;margin-bottom: 32px;}
        .sidebar-logo .logo-mark {width: 34px;height: 34px;background-color: #ffffff;border-radius: 10px;display: flex;align-items: center;justify-content: center;color: #111827;font-weight: 700;font-size: 18px;}
        .sidebar-logo .logo-text {font-size: 20px;font-weight: 700;letter-spacing: 0.5px;}
        .nav-item {display: flex;align-items: center;gap: 12px;padding: 11px 14px;border-radius: 12px;color: #d1d5db;cursor: pointer;transition: 0.22s ease;margin-bottom: 8px;font-size: 14px;}
        .nav-item:hover {background-color: #1f2937;color: #ffffff;}
        .nav-item.active {background-color: #ffffff;color: #111827;font-weight: 600;}
        .sidebar-bottom {margin-top: auto;padding-top: 24px;border-top: 1px solid #1f2937;}
        .user-card {background-color: #1f2937;border-radius: 14px;padding: 14px;margin-bottom: 16px;}
        .user-avatar {width: 42px;height: 42px;border-radius: 50%;background: linear-gradient(135deg, #fbbf24, #f97316);display: flex;align-items: center;justify-content: center;font-weight: 700;color: #111827;margin-bottom: 10px;}
        .user-name {font-size: 15px;font-weight: 600;color: #ffffff;}
        .user-role {font-size: 12px;color: #9ca3af;}
        .main-content {flex: 1;padding: 24px 32px;overflow-y: auto;}
        .page-title {margin-bottom: 24px;}
        .page-title h1 {font-size: 26px;font-weight: 800;letter-spacing: 0.5px;margin-bottom: 6px;}
        .page-title p {color: #6b7280;font-size: 15px;}
        .msg-card {background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,0.06);}
        .msg-header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .msg-title {font-size:16px;font-weight:700;}
        .msg-time {font-size:12px;color:#999;}
        .msg-content {font-size:14px;color:#333;line-height:1.6;}
        .unread {width:10px;height:10px;border-radius:50%;background:#ef4444;display:inline-block;margin-left:8px;}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div class="logo-mark">星</div>
                <div class="logo-text">星途平台</div>
            </div>
            <nav>
                <div class="nav-item active" onclick="location.href='index.html'">
                    <i class="fas fa-th-large"></i><span>仪表盘</span>
                </div>
                <div class="nav-item" onclick="location.href='race-info.html'">
                    <i class="fas fa-newspaper"></i><span>竞赛资讯</span>
                </div>
                <div class="nav-item" onclick="location.href='race-team.html'">
                    <i class="fas fa-users"></i><span>竞赛组队</span>
                </div>
                <div class="nav-item" onclick="location.href='teacher.html'">
                    <i class="fas fa-user-tie"></i><span>导师团队</span>
                </div>
                <div class="nav-item" onclick="location.href='community.html'">
                    <i class="fas fa-comments"></i><span>社区讨论</span>
                </div>
                <div class="nav-item" onclick="location.href='plan.html'">
                    <i class="fas fa-lightbulb"></i><span>升学规划</span>
                </div>
                <div class="nav-item" onclick="location.href='setting.html'">
                    <i class="fas fa-cog"></i><span>设置</span>
                </div>
            </nav>
        </div>
        <div class="sidebar-bottom">
            <div class="user-card">
                <div class="user-avatar">S</div>
                <div class="user-name">Student</div>
                <div class="user-role">大数据管理与应用 · 大二</div>
            </div>
            <div class="nav-item" onclick="logoutSys()">
                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <div class="page-title">
            <h1>消息中心</h1>
            <p>接收组队邀请、通知公告、导师消息和平台提醒</p>
        </div>

        <div class="msg-card">
            <div class="msg-header">
                <div class="msg-title">竞赛组队邀请 <span class="unread"></span></div>
                <div class="msg-time">2026-07-18 10:22</div>
            </div>
            <div class="msg-content">数模竞赛团队向你发出组队邀请，邀请你担任数据分析岗位，请尽快回复确认。</div>
        </div>

        <div class="msg-card">
            <div class="msg-header">
                <div class="msg-title">系统通知：Python课程作业提醒</div>
                <div class="msg-time">2026-07-17 18:00</div>
            </div>
            <div class="msg-content">你的Python项目报告作业将于本周日截止提交，请按时完成并上传系统。</div>
        </div>

        <div class="msg-card">
            <div class="msg-header">
                <div class="msg-title">导师消息：大创项目立项指导</div>
                <div class="msg-time">2026-07-16 14:30</div>
            </div>
            <div class="msg-content">请本周三下午到办公室讨论大创项目申报书细节，带好修改稿。</div>
        </div>
    </main>
<script>
if(!localStorage.getItem('isLogin')){
    window.location.href="login.html";
}
function logoutSys(){
    localStorage.removeItem('isLogin');
    localStorage.removeItem('userName');
    alert('已成功退出登录');
    window.location.href="login.html";
}
</script>
</body>
</html>
