<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python基础课程详情 - 星途平台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.3.0/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family: 'Inter', sans-serif;background-color: #f7f3ea;color:#111827;display:flex;min-height:100vh;}
        .sidebar {width:250px;background:#111827;color:white;min-height:100vh;padding:24px 20px;display:flex;flex-direction:column;justify-content:space-between;flex-shrink:0;}
        .sidebar-logo {display:flex;align-items:center;gap:10px;margin-bottom:32px;}
        .sidebar-logo .logo-mark {width:34px;height:34px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#111827;font-weight:700;font-size:18px;}
        .sidebar-logo .logo-text {font-size:20px;font-weight:700;letter-spacing:0.5px;}
        .nav-item {display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#d1d5db;cursor:pointer;transition:0.22s ease;margin-bottom:8px;font-size:14px;}
        .nav-item:hover {background:#1f2937;color:#fff;}
        .sidebar-bottom {margin-top:auto;padding-top:24px;border-top:1px solid #1f2937;}
        .user-card {background:#1f2937;border-radius:14px;padding:14px;margin-bottom:16px;}
        .user-avatar {width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;font-weight:700;color:#111827;margin-bottom:10px;}
        .user-name {font-size:15px;font-weight:600;color:#fff;}
        .user-role {font-size:12px;color:#9ca3af;}
        .main-content {flex:1;padding:24px 32px;overflow-y:auto;}
        .page-title {margin-bottom:24px;}
        .page-title h1 {font-size:26px;font-weight:800;letter-spacing:0.5px;margin-bottom:6px;}
        .page-title p {color:#6b7280;font-size:15px;}
        .card {background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 14px rgba(0,0,0,0.06);}
        .card-title {font-size:20px;font-weight:700;margin-bottom:16px;}
        .info-row {display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f3f4f6;}
        .btn {display:inline-block;padding:10px 18px;border-radius:999px;background:#111827;color:#fff;font-size:14px;font-weight:600;text-decoration:none;transition:0.2s;}
        .btn:hover {background:#1f2937;}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div class="logo-mark">星</div>
                <div class="logo-text">星途平台</div>
            </div>
            <nav>
                <div class="nav-item" onclick="location.href='index.html'">
                    <i class="fas fa-th-large"></i><span>仪表盘</span>
                </div>
            </nav>
        </div>
        <div class="sidebar-bottom">
            <div class="user-card">
                <div class="user-avatar">S</div>
                <div class="user-name">Student</div>
                <div class="user-role">大数据管理与应用 · 大二</div>
            </div>
            <div class="nav-item" onclick="logoutSys()">
                <i class="fas fa-sign-out-alt"></i><span>退出登录</span>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <div class="page-title">
            <h1>Python基础在线课程</h1>
            <p>周三 08:30-10:00 · 线上学习</p>
        </div>
        <div class="card">
            <div class="card-title">课程详情</div>
            <div class="info-row">
                <span class="text-gray-600">课程</span>
                <span class="font-semibold">Python数据分析入门</span>
            </div>
            <div class="info-row">
                <span class="text-gray-600">平台</span>
                <span class="font-semibold">学堂在线</span>
            </div>
            <div class="info-row">
                <span class="text-gray-600">本周内容</span>
                <span class="font-semibold">Pandas数据清洗基础</span>
            </div>
            <div class="mt-6">
                <a href="index.html" class="btn">返回仪表盘</a>
            </div>
        </div>
    </main>
<script>
if(!localStorage.getItem('isLogin')) location.href='login.html';
function logoutSys(){
    localStorage.removeItem('isLogin');
    localStorage.removeItem('userName');
    alert('已退出登录');
    location.href='login.html';
}
</script>
</body>
</html>
