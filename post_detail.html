// 获取页面ID渲染内容
let id = new URLSearchParams(location.search).get('id');
let info = postData[id];
let nowCommentList = [];
if(info){
    document.getElementById('dTitle').innerText = info.title;
    document.getElementById('dTime').innerText = info.time;
    document.getElementById('dTag').innerText = info.tag;
    document.getElementById('dContent').innerText = info.content;
    nowCommentList = [...info.comment];
    renderComment();
}

// 渲染评论
function renderComment(){
    let html = '';
    nowCommentList.forEach(item=>{
        html += `
        <div class="comment-item">
            <div class="com-user">${item.user}</div>
            <div class="com-time">${item.time}</div>
            <div class="com-text">${item.text}</div>
        </div>
        `;
    })
    document.getElementById('commentBox').innerHTML = html;
}

// 新增发表评论
function addComment(){
    let val = document.getElementById('myComment').value.trim();
    if(!val){
        alert("请输入评论内容！");
        return;
    }
    let newCom = {
        user:"在校学生",
        time:new Date().toLocaleString(),
        text:val
    };
    nowCommentList.unshift(newCom);
    renderComment();
    document.getElementById('myComment').value = "";
    alert("评论发布成功！");
}
</script>
